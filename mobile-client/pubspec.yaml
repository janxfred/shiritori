name: mobile_client
description: "開発合宿用モバイルアプリテンプレート"
publish_to: "none"
version: 1.0.0+15

environment:
  sdk: ^3.10.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any

  cupertino_icons: ^1.0.8
  dio: ^5.4.0
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3
  freezed_annotation: ^2.4.1
  json_annotation: ^4.8.1
  go_router: ^14.0.0
  google_mobile_ads: ^5.1.0
  flutter_dotenv: ^5.1.0
  url_launcher: ^6.3.0
  purchases_flutter: ^8.3.3
  shared_preferences: ^2.2.0
  google_fonts: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.8
  freezed: ^2.4.6
  json_serializable: ^6.7.1
  riverpod_generator: ^2.3.9
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/launcher_icon/icon_ios_v2.png"
  adaptive_icon_foreground: "assets/launcher_icon/icon_foreground_v2.png"
  adaptive_icon_background: "assets/launcher_icon/icon_background_v2.png"

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/悪魔.jpg
    - .env
